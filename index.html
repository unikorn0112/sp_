<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>春天宣言活動報名</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <style>
    /* 1. 全域背景：使用圖片中的溫暖米色 */
    body {
      background-color: #f4ece4;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      color: #4a3c31;
      margin: 0;
      padding: 10px;
    }

    /* 2. 表單容器：白色基底，帶有細微圓角與陰影 */
    .container {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(122, 90, 74, 0.1);
      max-width: 450px;
      margin: 20px auto;
    }

    /* 3. 標題設計：深木棕色 */
    .title {
      color: #7a5a4a !important;
      font-weight: bold;
      text-align: center;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #dccfc3;
      padding-bottom: 15px;
    }

    /* 4. 輸入框與選單：細線框設計 */
    .input, .select select {
      border: 1px solid #dccfc3 !important;
      border-radius: 8px !important;
      background-color: #fdfbf9 !important;
    }

    .input:focus, .select select:focus {
      border-color: #a68d7e !important;
      box-shadow: 0 0 0 0.125em rgba(166, 141, 126, 0.25) !important;
    }

    /* 5. 標籤文字顏色 */
    .label {
      color: #7a5a4a !important;
      font-size: 0.95rem;
    }

    /* 6. 提交按鈕：深木棕色 */
    .button.is-primary {
      background-color: #7a5a4a !important;
      color: #ffffff !important;
      border: none;
      border-radius: 8px;
      height: 3.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 1rem;
      width: 100%;
    }

    #price {
      background-color: #f8f3ef !important;
      color: #8d6e63;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <section class="section">
    <div class="container">
      <h1 class="title is-4">春天宣言活動報名</h1>
      
      <form id="enrollForm">
        <div class="field">
          <label class="label">1. 選擇活動</label>
          <div class="select is-fullwidth">
            <select name="activity" id="activity" onchange="updateOptions()">
              <option value="乳房護理培訓課程">乳房護理培訓課程</option>
              <option value="乳房護理培訓分享會">乳房護理培訓分享會</option>
              <option value="香囊DIY課程">香囊DIY課程</option>
              <option value="頭道 慢慢老">頭道 慢慢老</option>
              <option value="溫養 護目">溫養 護目</option>
              <option value="溫養 耳 頸">溫養 耳 頸</option>
              <option value="溫養 肩 胸 手">溫養 肩 胸 手</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label class="label">2. 活動日期</label>
          <div class="select is-fullwidth">
            <select name="date" id="date"></select>
          </div>
        </div>

        <div class="field">
          <label class="label">3. 活動費用</label>
          <input class="input" type="text" name="price" id="price" readonly>
        </div>

        <div class="field">
          <label class="label">4. 報名姓名</label>
          <input class="input" type="text" name="name" required placeholder="請輸入姓名">
        </div>

        <div class="field">
          <label class="label">5. 報名電話</label>
          <input class="input" type="tel" name="phone" required placeholder="請輸入電話">
        </div>

        <div class="field">
          <label class="label">6. LINE ID</label>
          <input class="input" type="text" name="lineId" required placeholder="請輸入 LINE ID">
        </div>

        <button type="submit" id="submitBtn" class="button is-primary">提交報名</button>
      </form>
    </div>
  </section>

  <script>
    // 請將下方的網址替換成你部署 GAS 後產生的 Web App URL
    const GAS_URL = "你的_GAS_網頁應用程式網址";

    const dataConfig = {
      "乳房護理培訓課程": { price: "39800元", dates: ["5/16+5/17", "5/23+5/24", "5/30+5/31"] },
      "乳房護理培訓分享會": { price: "1000元", dates: ["6/12", "6/19", "6/26"] },
      "香囊DIY課程": { price: "1000元", dates: ["6/4", "6/11", "6/18", "6/25"] },
      "頭道 慢慢老": { price: "500元", dates: ["6/13 早上 10:00", "6/20 早上 10:00", "6/27 早上 10:00"] },
      "溫養 護目": { price: "500元", dates: ["6/13 下午 13:00", "6/20 下午 13:00", "6/27 下午 13:00"] },
      "溫養 耳 頸": { price: "500元", dates: ["6/13 晚上 18:00", "6/20 晚上 18:00", "6/27 晚上 18:00"] },
      "溫養 肩 胸 手": { price: "500元", dates: ["6/14 下午 13:00", "6/21 下午 13:00", "6/28 下午 13:00"] }
    };

    function updateOptions() {
      const activity = document.getElementById('activity').value;
      const dateSelect = document.getElementById('date');
      const priceInput = document.getElementById('price');
      
      priceInput.value = dataConfig[activity].price;
      dateSelect.innerHTML = "";
      dataConfig[activity].dates.forEach(d => {
        let opt = document.createElement('option');
        opt.value = d;
        opt.innerHTML = d;
        dateSelect.appendChild(opt);
      });
    }

    // 初始化選單
    window.onload = updateOptions;

    // 表單提交處理
    document.getElementById('enrollForm').onsubmit = function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.classList.add('is-loading'); // 按鈕顯示讀取中

      const formData = {
        activity: document.getElementById('activity').value,
        date: document.getElementById('date').value,
        price: document.getElementById('price').value,
        name: document.getElementsByName('name')[0].value,
        phone: document.getElementsByName('phone')[0].value,
        lineId: document.getElementsByName('lineId')[0].value
      };

      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors", // 避免跨網域攔截
        body: JSON.stringify(formData)
      })
      .then(() => {
        alert("報名資料已成功送出！");
        btn.classList.remove('is-loading');
        document.getElementById('enrollForm').reset();
        updateOptions();
      })
      .catch(err => {
        alert("提交發生錯誤，請稍後再試。");
        console.error(err);
        btn.classList.remove('is-loading');
      });
    };
  </script>
</body>
</html>
